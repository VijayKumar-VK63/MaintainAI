version: '3.8'

services:
  vllm-server:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: maintainai-vllm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8000:8000"
    volumes:
      # Mount LoRA adapter from host
      - ${LORA_PATH:-./models/slm/adapter_latest}:/adapter:ro
    command:
      - --model
      - Qwen/Qwen2.5-3B-Instruct
      - --lora-path
      - /adapter
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: API server for local development
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    container_name: maintainai-api
    ports:
      - "8001:8000"
    environment:
      - SLM_INFERENCE_ENDPOINT=http://vllm-server:8000
      - API_BASE_URL=http://localhost:8001
    depends_on:
      vllm-server:
        condition: service_healthy
    volumes:
      - ../configs:/app/configs:ro
      - ../models/predictive:/app/models/predictive:ro
      - ../data/slm:/app/data/slm:ro
    restart: unless-stopped

  # Optional: Streamlit dashboard
  streamlit:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.streamlit
    container_name: maintainai-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ../configs:/app/configs:ro
    restart: unless-stopped