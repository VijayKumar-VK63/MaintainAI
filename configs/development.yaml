slm:
  model_name: "Qwen/Qwen2.5-3B-Instruct"
  # auto -> remote endpoint if set, else local GGUF, else transformers adapter.
  # Explicit: llamacpp | openai | transformers | demo (demo is for tests only).
  backend: "auto"
  quantization: "4bit"
  adapter_path: "models/slm/maintainai-qwen2.5-3b-lora.gguf"
  # llamacpp backend (CPU): quantized base GGUF + optional GGUF LoRA
  model_path: "models/slm/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
  n_ctx: 2048
  n_threads: null
  n_batch: 512
  seed: 42
  # llama.cpp LoRA multiplier (1.0 = alpha/rank as stored in the adapter)
  lora_scale: 1.0
  # Force schema-valid JSON via GBNF grammar (recommended for production)
  constrained: true
  inference_endpoint: ""
  inference_path: "/v1/chat/completions"
  api_key: ""
  include_knowledge: false
  max_new_tokens: 256
  temperature: 0.2
  max_seq_length: 1024
  trust_remote_code: false

predictive:
  model_version: "rul-xgb-clf-v1"
  model_path: "models/predictive"
  scaler_path: "models/predictive/scaler_fd001.joblib"
  feature_schema: "models/predictive/feature_schema.json"
  decision_threshold: 0.65
  rul_cap: 125
  feature_window: 30

simulation:
  default_machine: "M001"
  machines: ["M001", "M002", "M003"]
  seed: 42
  tick_seconds: 1.0

api:
  host: "127.0.0.1"
  port: 8000

dataset:
  name: "cmapss-fd001"
  raw_dir: "CMAPSSData"
  subset: "FD001"
  processed_dir: "data/processed"

logging:
  level: "INFO"
  format: "json"
