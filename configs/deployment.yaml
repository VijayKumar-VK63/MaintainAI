slm:
  # Deployment: OpenAI-compatible inference (HF TGI endpoint, vLLM, llama.cpp).
  # Set SLM_INFERENCE_ENDPOINT and SLM_API_KEY (or HF_TOKEN) in the environment.
  model_name: "Qwen/Qwen2.5-3B-Instruct"
  backend: "openai"
  quantization: "4bit"
  adapter_path: null
  inference_endpoint: ""
  # llama.cpp/vLLM/TGI: /v1/chat/completions; TGI /generate is also supported.
  inference_path: "/v1/chat/completions"
  api_key: ""
  include_knowledge: false
  max_new_tokens: 256
  temperature: 0.2

predictive:
  model_version: "rul-xgb-clf-v1"
  model_path: "models/predictive"
  decision_threshold: 0.65

simulation:
  default_machine: "M001"
  seed: 42

api:
  host: "0.0.0.0"
  port: 8000
