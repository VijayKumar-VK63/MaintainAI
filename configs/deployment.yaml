slm:
  # Deployment: remote inference via HF Inference Endpoint
  # Create endpoint at: https://huggingface.co/models/Vijay-kumar-63/maintainai-qwen2.5-3b-lora -> "Deploy" -> "Inference Endpoint"
  model_name: "Qwen/Qwen2.5-3B-Instruct"
  quantization: "4bit"
  adapter_path: null
  inference_endpoint: ""
  max_new_tokens: 256
  temperature: 0.2

predictive:
  model_version: "rul-xgb-clf-v1"
  model_path: "models/predictive"
  decision_threshold: 0.65

simulation:
  default_machine: "M001"
  seed: 42

api:
  host: "0.0.0.0"
  port: 8000
